name: CMS Media

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload as JSON
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: cms-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Optimize images and rebuild pages
        run: |
          npm run optimize-images
          npm run rebuild-gallery
          npm run build:cms

      - name: Commit optimized media
        run: |
          if git diff --quiet; then
            echo "Media is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- galeria artykul osoby '*.html' '*.min.js' '*.min.css' cms-data.js bandsintown-events.csv
          git commit -m "Optimize media from Pages CMS"
          git push origin HEAD:${{ github.ref_name }}
