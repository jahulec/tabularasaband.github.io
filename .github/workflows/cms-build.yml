name: CMS Build

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "content/news/**"
      - "script.js"
      - ".pages.yml"
      - "scripts/build-cms.mjs"
      - "scripts/export-bandsintown-events.mjs"
      - "scripts/sync-shows-from-calendar.mjs"
      - "package.json"
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload as JSON
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: cms-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Render CMS content
        run: npm run build:cms

      - name: Validate generated site
        run: |
          npm run check:encoding
          npm run check:seo
          npm run test:generator

      - name: Commit generated pages
        run: |
          if git diff --quiet; then
            echo "CMS output is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' '*.min.js' '*.min.css' cms-data.js bandsintown-events.csv
          git commit -m "Build site content from CMS"
          git push origin HEAD:${{ github.ref_name }}
